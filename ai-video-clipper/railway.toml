[build]
builder = "dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "backend"
dockerfilePath = "backend/Dockerfile"
port = 8000

[[services]]
name = "frontend"
dockerfilePath = "frontend/Dockerfile"
port = 3000

[volumes]
backend_data = "/app/data"